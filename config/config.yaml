# Trading system configuration.
# Modes, in order of rollout: record -> paper -> demo -> live.
#   record: collect market data + forecasts only
#   paper:  strategies run on live prices, hypothetical fills only
#   demo:   real orders on a venue's sandbox (Kalshi only; Polymarket US has no sandbox)
#   live:   real money. Also requires live_enabled: true on the venue AND an interactive confirmation.

db_path: db/trading.sqlite

venues:
  kalshi:
    mode: paper
    live_enabled: false          # do not flip without reading README "Going live"
    # Basic tier read budget = 200 tokens/s at 10 tokens/request = 20 req/s. Stay well under it:
    # at 8 req/s, refreshing 48 weather series right after a restart drew a few 429s (2026-10-12).
    max_requests_per_second: 5
  polymarket_us:
    mode: paper                  # no sandbox exists, so the path is record -> paper -> live
    live_enabled: false
    # Retail API (authenticated) documents 25 req/s per IP. The public gateway is undocumented; measured
    # 2026-10-12: listings tolerate ~2 req/s, but /book and /bbo allow only ~5 per 10s, then 429 for 10s.
    max_requests_per_second: 2
    book_requests_per_second: 0.3

# A strategy trades a venue at the LOWER of (strategy mode, venue mode): record < paper < demo < live.
# So paper trading needs both the strategy and the venue at `paper` (or higher).
strategies:
  weather_fair_value:
    mode: paper
    cities: all                  # or a list of codes, e.g. [NYC, CHI]
    variables: [high, low]       # daily high and/or daily low markets
    max_entries_per_market_side: 1   # bet each bracket/side once (repeat buys add money at risk, not samples)
    min_edge: 0.05               # dollars per contract, after fees
    max_edge: 0.15               # edges above this are logged as "suspect" and NOT traded (likely model error)
    # Core of the model: a calibrated blend of the GFS+ECMWF deterministic average and NOAA's National
    # Blend of Models. Its bias and typical error are fitted on the BLEND's own history (walk-forward
    # test 2025-04..2026-10: log loss 2.326 vs 2.366 GFS+ECMWF alone; long shots 1.8% said vs 1.6% happened).
    nbm_weight: 0.5
    # Other inputs only nudge the center; they can't be calibrated until we've recorded a few months of them
    # (recording since 2026-10-12). Ensemble means get the blend's bias correction.
    input_weights:
      calibrated_blend: 0.75
      nws_point: 0.125
      gfs_ensemble_mean: 0.0625
      ecmwf_ensemble_mean: 0.0625
    # Widening sigma when inputs disagree fattened the tails and overpriced long shots (2.3% said vs 1.6%
    # happened in the same test), so it's off.
    inflate_sigma_for_disagreement: false
    min_book_contracts: 5        # need at least this many contracts available at qualifying prices
    kelly_fraction: 0.10
    calibration_window_days: 30  # seasonal window (+/- days of year) for bias/sigma
    use_observed_floor: true     # same-day: high observed so far is a hard floor (low: a ceiling)
    same_day_cutoff_hour_lst: 12 # no same-day trades from this hour (local standard time) on
    same_day_variables: [high]   # lows off same-day: a cold front can set a new low late in the evening
    min_minutes_to_close: 30
    prediction_log_minutes: 60   # how often every market's model probability is logged
  cross_venue_gap:
    mode: record                 # not built yet; paper only until approved

# Risk limits (paper defaults; live will get its own, much lower, limits). Dollar amounts are cost basis.
risk:
  # Paper only: ignore the exposure caps and the daily loss halt below, to build a bigger sample.
  # Kill switch, stale-data and order sanity checks still apply. Has no effect on demo/live.
  paper_uncapped: true
  paper_bankroll_usd: 1000
  max_position_per_market_usd: 50
  max_exposure_per_event_usd: 100      # one city-day; brackets in an event are mutually exclusive
  max_exposure_per_venue_usd: 300
  max_total_exposure_usd: 500
  max_new_exposure_per_day_usd: 250
  daily_loss_limit_usd: 100            # realized + mark-to-market; hitting it halts trading for the day
  max_contracts_per_order: 200
  min_price: 0.02                      # never buy below/above these (thin edges, fee rounding dominates)
  max_price: 0.98
  max_book_age_seconds: 150
  max_forecast_age_minutes: 180

recorder:
  snapshot_interval_seconds: 60
  forecast_interval_seconds: 1800
  market_refresh_interval_seconds: 600   # re-list markets/rules (books are polled every snapshot)

# Every US city Kalshi lists daily-high/low temperature markets for (verified 2026-10-12: 24 stations).
# `kalshi_series` = daily-high series, `kalshi_low_series` = daily-low series,
# `polymarket_event_prefix` = Polymarket US daily-high event slug prefix (only 5 cities are listed there).
# Station/coordinates/timezone come from api.weather.gov for the CLI station named in the market rules.
weather:
  nws_user_agent_env: NWS_USER_AGENT
  ensemble_models: [gfs_seamless, ecmwf_ifs025]   # icon_seamless currently errors on Open-Meteo
